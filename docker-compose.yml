version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx_ssl
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    restart: always

  backend:
    image: priyanshchowhan/app-backend:latest
    container_name: backend
    env_file:
      - ./backend/.env.production
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    expose:
      - "5000"
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: always

  sync-worker:
    image: priyanshchowhan/app-backend:latest
    container_name: sync_worker
    command: ["node", "src/workers/syncWorker.js"]
    env_file:
      - ./backend/.env.production
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SYNC_WORKER_CONCURRENCY=5
    depends_on:
      - redis
    restart: always

  frontend:
    image: priyanshchowhan/app-frontend:latest
    container_name: money-mirror_frontend_1
    expose:
      - "80"
    restart: always

volumes:
  redis_data:
